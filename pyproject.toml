[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpl-rosa"
version = "1.0.10"
description = "ROSA: the Robot Operating System Agent"
readme = "README.md"
authors = [{ name = "Rob Royce", email = "Rob.Royce@jpl.nasa.gov" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["Robotics", "Data Science", "Machine Learning", "Data Engineering", "Data Infrastructure", "Data Analysis"]
requires-python = ">=3.10, <4"
dependencies = [
    "PyYAML==6.0.1",
    "python-dotenv>=1.0.1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "openai>=2.21,<3",
    "pydantic",
    "pyinputplus",
    "cffi",
    "rich",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
    "mujoco>=3.3,<4",
]

[project.urls]
"Homepage" = "https://github.com/nasa-jpl/rosa"
"Bug Tracker" = "https://github.com/nasa-jpl/rosa/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "arm_agent",
    "arm_agent.*",
    "codex",
    "codex.*",
    "prompts",
    "prompts.*",
    "rosa",
    "rosa.*",
    "sessions",
    "sessions.*",
    "tools",
    "tools.*",
    "turtle_agent",
    "turtle_agent.*",
]
